version: "3.9"

services:
  api:
    image: anujbhagat/water-tracker-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  dashboard:
    image: anujbhagat/water-tracker-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    restart: always